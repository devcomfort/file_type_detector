[project]
name = "filetype-detector"
version = "0.3.0"
description = "A flexible Python library for file type inference using multiple strategies including extension-based, magic number-based, and AI-powered detection"
authors = [
    { name = "devcomfort", email = "im@devcomfort.me" }
]
license = { text = "MIT" }
dependencies = [
    "python-magic>=0.4.27",
    "magika>=1.0.1",
    "rich>=14.2.0",
    "textual>=8.2.8",
]
readme = "README.md"
requires-python = ">=3.10"
keywords = ["file-type", "mime-type", "file-detection", "magic-numbers", "ai-detection"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Topic :: Utilities",
]

[project.scripts]
filetype-detector-demo = "filetype_detector.__main__:main"

[project.optional-dependencies]
dev = [
    "build>=1.3.0",
    "mkdocs>=1.6.1",
    "mkdocs-material>=9.6.23",
    "mkdocstrings[python]>=0.24.0",
    "mypy>=1.20.2",
    "pymdown-extensions>=10.16.1",
    "pytest>=8.4.2",
    "ruff>=0.15.11",
    "tabulate>=0.10.0",
    "twine>=6.2.0",
    "wcwidth>=0.6.0",
]
docs = [
    "mkdocs>=1.6.1",
    "mkdocs-material>=9.5.0",
    "mkdocstrings[python]>=0.24.0",
    "pymdown-extensions>=10.0.0",
]
fixtures = [
    "cryptography",
    "ezdxf",
    "fastavro",
    "fonttools",
    "h5py",
    "lz4",
    "mutagen",
    "numpy",
    "numpy-stl",
    "onnx",
    "opencv-python-headless",
    "pillow",
    "pillow-avif-plugin",
    "pillow-heif",
    "pillow-jxl-plugin",
    "protobuf",
    "py7zr",
    "pyarrow",
    "pydicom",
    "scapy",
    "zstandard",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.rye]
managed = true
dev-dependencies = [
    "build>=1.3.0",
    "mkdocs>=1.6.1",
    "mkdocs-material>=9.6.23",
    "mkdocstrings[python]>=0.24.0",
    "mypy>=1.20.2",
    "pymdown-extensions>=10.16.1",
    "pytest>=8.4.2",
    "ruff>=0.15.11",
    "tabulate>=0.10.0",
    "twine>=6.2.0",
    "wcwidth>=0.6.0",
]

[tool.hatch.metadata]
allow-direct-references = true

[tool.hatch.build.targets.wheel]
packages = ["src/filetype_detector"]
