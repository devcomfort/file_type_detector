name: Backend conformance

on:
  pull_request:
    paths:
      - "src/filetype_detector/**"
      - "scripts/conformance/**"
      - "tests/truth/**"
      - "tests/fixtures/**"
      - "pyproject.toml"
      - "requirements*.lock"
      - ".github/workflows/backend-conformance.yml"
  workflow_dispatch:
  schedule:
    - cron: "0 7 * * 1"

permissions:
  contents: read

concurrency:
  group: backend-conformance-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHON_VERSION: "3.12"
  CANDIDATES: tests/truth/backend_inventory_candidates.json
  INVENTORY: tests/truth/backend_inventory.json

jobs:
  determinism-gate:
    name: Determinism and exact-byte gate
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: requirements-dev.lock

      - name: Install locked dependencies
        shell: bash
        run: |
          python -m pip install -r requirements-dev.lock
          python -m pip install --no-deps -e .

      - name: Install ffmpeg for audio generators
        shell: bash
        run: sudo apt-get install -y ffmpeg

      - name: Run exact-byte gate and determinism tests
        shell: bash
        run: |
          python -m pytest tests/conformance/test_exact_byte_gate.py tests/conformance/test_evaluator.py -v

      - name: Run slow determinism scan (2.1s interval, Tier2 allowlist enforced)
        shell: bash
        run: |
          python -m scripts.conformance.determinism_scan

  collect:
    name: Collect ${{ matrix.platform }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: ubuntu
            runner: ubuntu-22.04
            runner_label: ubuntu-x64
          - platform: macos
            runner: macos-15-intel
            runner_label: macos-x64
          - platform: windows
            runner: windows-2022
            runner_label: windows-x64
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: requirements-dev.lock

      - name: Verify x64 runner architecture
        if: runner.os != 'Windows'
        shell: bash
        run: |
          architecture="$(uname -m)"
          test "$architecture" = "x86_64"
          echo "RUNNER_ARCHITECTURE=$architecture" >> "$GITHUB_ENV"

      - name: Verify x64 runner architecture
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $architecture = [System.Runtime.InteropServices.RuntimeInformation]::ProcessArchitecture.ToString().ToLowerInvariant()
          if ($architecture -ne "x64") { throw "Expected x64 runner process architecture, got $architecture" }
          "RUNNER_ARCHITECTURE=x86_64" >> $env:GITHUB_ENV

      - name: Install libmagic on Ubuntu
        if: matrix.platform == 'ubuntu'
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y file libmagic1
          version="$(dpkg-query --showformat='${Version}' --show libmagic1)"
          echo "LIBMAGIC_DISTRIBUTION=apt:libmagic1=$version" >> "$GITHUB_ENV"
          file --version | head -n 1
          echo "Selected Ubuntu libmagic distribution: apt:libmagic1=$version"

      - name: Install libmagic on macOS
        if: matrix.platform == 'macos'
        shell: bash
        run: |
          brew install libmagic
          prefix="$(brew --prefix libmagic)"
          version="$(brew list --versions libmagic | cut -d' ' -f2)"
          test -n "$version"
          test -f "$prefix/share/misc/magic.mgc"
          echo "DYLD_FALLBACK_LIBRARY_PATH=$prefix/lib" >> "$GITHUB_ENV"
          echo "MAGIC=$prefix/share/misc/magic.mgc" >> "$GITHUB_ENV"
          echo "LIBMAGIC_DISTRIBUTION=homebrew:libmagic=$version" >> "$GITHUB_ENV"
          echo "Selected macOS libmagic distribution: homebrew:libmagic=$version"

      - name: Install locked dependencies
        shell: bash
        run: |
          python -m pip install -r requirements-dev.lock
          python -m pip install --no-deps -e .

      - name: Install selected Windows libmagic distribution
        if: matrix.platform == 'windows'
        shell: pwsh
        run: |
          python -m pip install --force-reinstall "python-magic-bin==0.4.14"
          $version = python -c "import importlib.metadata; print(importlib.metadata.version('python-magic-bin'))"
          if ($version -ne "0.4.14") { throw "Expected python-magic-bin 0.4.14, got $version" }
          "LIBMAGIC_DISTRIBUTION=python-magic-bin==$version" >> $env:GITHUB_ENV
          Write-Host "Selected Windows libmagic distribution: python-magic-bin==$version"

      - name: Prove selected libmagic works
        shell: bash
        run: |
          python -c "import magic; result = magic.from_file('tests/fixtures/sample.pdf'); assert result; print(result)"

      - name: Require complete independently reviewed inventory
        shell: bash
        run: |
          python -m scripts.conformance.cli review \
            --candidates "$CANDIDATES" \
            --inventory "$INVENTORY" \
            --root . \
            --require-complete

      - name: Collect fresh-process backend observations
        shell: bash
        run: |
          python -m scripts.conformance.collector collect \
            --candidates "$CANDIDATES" \
            --inventory "$INVENTORY" \
            --root . \
            --runner-label "${{ matrix.runner_label }}" \
            --output "backend-conformance-${{ matrix.platform }}.json"

      - name: Upload platform observation artifact
        uses: actions/upload-artifact@v4
        with:
          name: backend-conformance-${{ matrix.platform }}
          path: backend-conformance-${{ matrix.platform }}.json
          if-no-files-found: error
          retention-days: 14

  aggregate:
    name: Aggregate backend conformance evidence
    needs: collect
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: requirements-dev.lock

      - name: Install locked dependencies
        shell: bash
        run: |
          python -m pip install -r requirements-dev.lock
          python -m pip install --no-deps -e .

      - name: Download platform observation artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: backend-conformance-*
          path: conformance-artifacts
          merge-multiple: true

      - name: Aggregate and compare backend conformance evidence
        shell: bash
        run: |
          baseline_args=()
          if [[ -f tests/truth/backend_conformance_baseline.json ]]; then
            baseline_args=(--baseline tests/truth/backend_conformance_baseline.json)
          fi
          python -m scripts.conformance.aggregate \
            --candidates "$CANDIDATES" \
            --inventory "$INVENTORY" \
            --root . \
            --input conformance-artifacts/backend-conformance-ubuntu.json \
            --input conformance-artifacts/backend-conformance-macos.json \
            --input conformance-artifacts/backend-conformance-windows.json \
            --output-dir reports \
            --expected-runner-label ubuntu-x64 \
            --expected-runner-label macos-x64 \
            --expected-runner-label windows-x64 \
            "${baseline_args[@]}"

      - name: Publish report to job summary
        shell: bash
        run: |
          cat reports/backend-conformance.md >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "Full JSON and CSV evidence are attached as the backend-conformance-report artifact." >> "$GITHUB_STEP_SUMMARY"

      - name: Upload aggregate evidence
        uses: actions/upload-artifact@v4
        with:
          name: backend-conformance-report
          path: reports
          if-no-files-found: error
          retention-days: 14
