name: PyPI Release

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - 'pyproject.toml'

jobs:
  check-version:
    runs-on: ubuntu-latest
    outputs:
      should-release: ${{ steps.check.outputs.should_release }}
      new-version: ${{ steps.check.outputs.new_version }}
      old-version: ${{ steps.check.outputs.old_version }}
      is-semantic: ${{ steps.check.outputs.is_semantic }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Check version and determine if should release
        id: check
        env:
          EVENT_NAME: ${{ github.event_name }}
        run: |
          # Initialize variables with default values
          SHOULD_RELEASE="false"
          NEW_VERSION=""
          OLD_VERSION=""
          IS_SEMANTIC="false"
          
          if [ "$EVENT_NAME" == "workflow_dispatch" ]; then
            CURRENT_VERSION=$(grep -E '^version\s*=' pyproject.toml | sed -E 's/version\s*=\s*["'\'']([^"'\'']+)["'\'']/\1/')

            if [[ "$CURRENT_VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
              NEW_VERSION="$CURRENT_VERSION"
              OLD_VERSION="$CURRENT_VERSION"
              SHOULD_RELEASE="true"
              IS_SEMANTIC="true"
              echo "Using pyproject.toml version for release: $CURRENT_VERSION"
            else
              echo "Error: Current version '$CURRENT_VERSION' does not follow semantic versioning (X.Y.Z)"
              echo "Set a valid version in pyproject.toml before dispatching a release"
              exit 1
            fi
          else
            # Automatic trigger on push
            if git diff HEAD~1 HEAD --name-only | grep -q "^pyproject.toml$"; then
              OLD_VERSION=$(git show HEAD~1:pyproject.toml | grep -E '^version\s*=' | sed -E 's/version\s*=\s*["'\'']([^"'\'']+)["'\'']/\1/')
              NEW_VERSION=$(grep -E '^version\s*=' pyproject.toml | sed -E 's/version\s*=\s*["'\'']([^"'\'']+)["'\'']/\1/')
              
              if [ "$OLD_VERSION" != "$NEW_VERSION" ]; then
                # Validate semantic version format (X.Y.Z)
                if [[ "$NEW_VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
                  SHOULD_RELEASE="true"
                  IS_SEMANTIC="true"
                  echo "Semantic version detected: $OLD_VERSION -> $NEW_VERSION"
                else
                  echo "Warning: Version $NEW_VERSION does not follow semantic versioning (X.Y.Z format)"
                fi
              fi
            fi
          fi
          
          # Write outputs once at the end to avoid duplicates
          {
            echo "should_release=$SHOULD_RELEASE"
            echo "new_version=$NEW_VERSION"
            echo "old_version=$OLD_VERSION"
            echo "is_semantic=$IS_SEMANTIC"
          } >> "$GITHUB_OUTPUT"
          
          # Debug output
          echo "Debug - Outputs set:"
          echo "  should_release: $SHOULD_RELEASE"
          echo "  new_version: $NEW_VERSION"
          echo "  old_version: $OLD_VERSION"
          echo "  is_semantic: $IS_SEMANTIC"
          
      - name: Display outputs for debugging
        run: |
          echo "Job outputs will be:"
          echo "  should-release: ${{ steps.check.outputs.should_release }}"
          echo "  new-version: ${{ steps.check.outputs.new_version }}"
          echo "  old-version: ${{ steps.check.outputs.old_version }}"
          echo "  is-semantic: ${{ steps.check.outputs.is_semantic }}"

  build-test-release:
    needs: check-version
    if: needs.check-version.outputs.should-release == 'true' && needs.check-version.outputs.is-semantic == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libmagic1

      - name: Install locked dependencies
        run: |
          python -m pip install -r requirements-dev.lock
          python -m pip install --no-deps -e .

      - name: Run tests
        run: python -m pytest

      - name: Build package
        run: python -m build

      - name: Check package
        run: python -m twine check dist/*

      - name: Verify built version and wheel import
        env:
          EXPECTED_VERSION: ${{ needs.check-version.outputs.new-version }}
        run: |
          python - <<'PY'
          import glob
          import os
          import zipfile
          from email.parser import BytesParser

          wheels = glob.glob("dist/*.whl")
          assert len(wheels) == 1, f"Expected one wheel, found: {wheels}"

          with zipfile.ZipFile(wheels[0]) as archive:
              metadata_files = [
                  name for name in archive.namelist()
                  if name.endswith(".dist-info/METADATA")
              ]
              assert len(metadata_files) == 1, metadata_files
              metadata = BytesParser().parsebytes(archive.read(metadata_files[0]))

          actual_version = metadata["Version"]
          expected_version = os.environ["EXPECTED_VERSION"]
          assert actual_version == expected_version, (
              f"Built version {actual_version!r} does not match "
              f"release version {expected_version!r}"
          )
          print(f"Verified built version: {actual_version}")
          PY

          python -m venv --clear /tmp/filetype-detector-wheel-smoke
          /tmp/filetype-detector-wheel-smoke/bin/python -m pip install --force-reinstall dist/*.whl
          cd /tmp
          /tmp/filetype-detector-wheel-smoke/bin/python - <<'PY'
          import os
          from importlib.metadata import version
          from pathlib import Path

          import filetype_detector
          from filetype_detector import AutoInferencer

          package_path = Path(filetype_detector.__file__).resolve()
          smoke_root = Path("/tmp/filetype-detector-wheel-smoke")
          assert smoke_root in package_path.parents, package_path
          assert version("filetype-detector") == os.environ["EXPECTED_VERSION"]
          assert AutoInferencer("lexical").infer("report.PDF").extensions == (".pdf",)
          print(f"Imported wheel package from {package_path}")
          PY

      - name: Publish to TestPyPI
        env:
          TWINE_USERNAME: __token__
          TWINE_PASSWORD: ${{ secrets.TESTPYPI_API_TOKEN }}
        run: python -m twine upload --repository testpypi dist/* --verbose

      - name: Verify TestPyPI installation
        env:
          EXPECTED_VERSION: ${{ needs.check-version.outputs.new-version }}
        run: |
          python -m venv --clear /tmp/filetype-detector-testpypi-smoke
          mkdir -p /tmp/filetype-detector-testpypi-dist
          for attempt in 1 2 3 4 5; do
            if /tmp/filetype-detector-testpypi-smoke/bin/python -m pip download \
              --index-url https://test.pypi.org/simple/ \
              --no-cache-dir \
              --no-deps \
              --only-binary=:all: \
              --dest /tmp/filetype-detector-testpypi-dist \
              "filetype-detector==$EXPECTED_VERSION"; then
              break
            fi

            if [ "$attempt" -eq 5 ]; then
              echo "TestPyPI package was not available after 5 attempts"
              exit 1
            fi

            echo "Waiting for TestPyPI propagation (attempt $attempt/5)"
            sleep 15
          done
          /tmp/filetype-detector-testpypi-smoke/bin/python -m pip install /tmp/filetype-detector-testpypi-dist/*.whl
          cd /tmp
          /tmp/filetype-detector-testpypi-smoke/bin/python - <<'PY'
          import os
          from importlib.metadata import version
          from pathlib import Path

          import filetype_detector

          package_path = Path(filetype_detector.__file__).resolve()
          smoke_root = Path("/tmp/filetype-detector-testpypi-smoke")
          assert smoke_root in package_path.parents, package_path
          assert version("filetype-detector") == os.environ["EXPECTED_VERSION"]
          print(f"Imported TestPyPI package from {package_path}")
          PY

      - name: Publish to PyPI
        env:
          TWINE_USERNAME: __token__
          TWINE_PASSWORD: ${{ secrets.PYPI_API_TOKEN }}
        run: python -m twine upload dist/* --verbose

