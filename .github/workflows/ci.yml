name: CI

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.10', '3.11', '3.12', '3.13']
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: requirements-dev.lock

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libmagic1

      - name: Install locked dependencies
        run: |
          python -m pip install -r requirements-dev.lock
          python -m pip install --no-deps -e .

      - name: Run tests
        run: python -m pytest

      - name: Run lint checks
        if: matrix.python-version == '3.13'
        run: python -m ruff check src tests scripts examples

      - name: Run type checks
        if: matrix.python-version == '3.13'
        run: python -m mypy src/filetype_detector --ignore-missing-imports

      - name: Build documentation
        if: matrix.python-version == '3.13'
        run: python -m mkdocs build --strict

      - name: Build distributions
        if: matrix.python-version == '3.13'
        run: python -m build

      - name: Check distributions
        if: matrix.python-version == '3.13'
        run: python -m twine check dist/*

      - name: Smoke-test built wheel
        if: matrix.python-version == '3.13'
        run: |
          python -m venv --clear /tmp/filetype-detector-wheel-smoke
          /tmp/filetype-detector-wheel-smoke/bin/python -m pip install --force-reinstall dist/*.whl
          cd /tmp
          /tmp/filetype-detector-wheel-smoke/bin/python - <<'PY'
          import importlib.metadata
          from pathlib import Path

          import filetype_detector
          from filetype_detector import AutoInferencer, FileType

          package_path = Path(filetype_detector.__file__).resolve()
          smoke_root = Path("/tmp/filetype-detector-wheel-smoke")
          assert smoke_root in package_path.parents, package_path
          distribution_metadata = importlib.metadata.metadata("filetype-detector")
          assert distribution_metadata["Requires-Python"] == ">=3.10"

          result = AutoInferencer("lexical").infer("report.PDF")
          assert result == FileType(
              extensions=(".pdf",),
              mime_types=("application/pdf",),
          ), result
          print(f"Imported wheel package from {package_path}")
          print(f"Lexical smoke result: {result!r}")
          PY
