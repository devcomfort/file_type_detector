<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 670" width="900" height="670">
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#080d1a"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>

    <pattern id="dotGrid" width="40" height="40" patternUnits="userSpaceOnUse">
      <circle cx="20" cy="20" r="0.5" fill="rgba(255,255,255,0.03)"/>
    </pattern>

    <radialGradient id="magicFill" cx="50%" cy="50%" r="50%">
      <stop offset="0%"   stop-color="rgba(37, 99, 235, 0.36)"/>
      <stop offset="40%"  stop-color="rgba(37, 99, 235, 0.22)"/>
      <stop offset="100%" stop-color="rgba(37, 99, 235, 0.05)"/>
    </radialGradient>

    <radialGradient id="magikaFill" cx="50%" cy="50%" r="50%">
      <stop offset="0%"   stop-color="rgba(22, 163, 74, 0.36)"/>
      <stop offset="40%"  stop-color="rgba(22, 163, 74, 0.22)"/>
      <stop offset="100%" stop-color="rgba(22, 163, 74, 0.05)"/>
    </radialGradient>

    <filter id="textGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="2" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <rect width="900" height="670" fill="url(#bgGrad)"/>
  <rect width="900" height="670" fill="url(#dotGrid)"/>

  <rect x="14" y="14" width="872" height="642" rx="4" fill="none" stroke="rgba(255,255,255,0.05)" stroke-width="1"/>

  <!-- TITLE -->
  <text x="450" y="50" text-anchor="middle" fill="#f1f5f9" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="20" font-weight="700" letter-spacing="0.3">
    File Type Detection Accuracy: Magic &cup; Magika
  </text>
  <text x="450" y="72" text-anchor="middle" fill="#64748b" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="11.5" font-weight="400">
    598 file format samples tested against both detection engines
  </text>
  <line x1="220" y1="83" x2="680" y2="83" stroke="rgba(59, 130, 246, 0.22)" stroke-width="0.5"/>

  <!-- VENN CIRCLES -->
  <!--
    Magic:  cx=305 cy=330 r=135  &rarr; x-range [170, 440]
    Magika: cx=495 cy=330 r=162  &rarr; x-range [333, 657]
    Overlap on centerline: [333, 440], width=107px, centroid&asymp;386
  -->

  <!-- Magic fill (behind) -->
  <circle cx="305" cy="330" r="135" fill="url(#magicFill)" stroke="none"/>

  <!-- Magika fill (on top &mdash; opacity blends in overlap) -->
  <circle cx="495" cy="330" r="162" fill="url(#magikaFill)" stroke="none"/>

  <!-- Magic outline (after both fills) -->
  <circle cx="305" cy="330" r="135" fill="none" stroke="rgba(37, 99, 235, 0.62)" stroke-width="1.5"/>

  <!-- Magika outline -->
  <circle cx="495" cy="330" r="162" fill="none" stroke="rgba(22, 163, 74, 0.62)" stroke-width="1.5"/>

  <!-- REGION NUMBERS -->
  <g font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" text-anchor="middle">

    <!-- Magic-only (left) -->
    <text x="235" y="323" fill="#f8fafc" font-size="48" font-weight="800" letter-spacing="-1" filter="url(#textGlow)">161</text>
    <text x="235" y="348" fill="#94a3b8" font-size="11" font-weight="400">formats</text>

    <!-- Intersection (center) -->
    <text x="386" y="323" fill="#f8fafc" font-size="48" font-weight="800" letter-spacing="-1" filter="url(#textGlow)">197</text>
    <text x="386" y="348" fill="#94a3b8" font-size="11" font-weight="400">formats</text>

    <!-- Magika-only (right) -->
    <text x="565" y="323" fill="#f8fafc" font-size="48" font-weight="800" letter-spacing="-1" filter="url(#textGlow)">177</text>
    <text x="565" y="348" fill="#94a3b8" font-size="11" font-weight="400">formats</text>

  </g>

  <!-- LABELS ABOVE CIRCLES -->

  <!-- Magic label -->
  <circle cx="305" cy="155" r="4.5" fill="#2563EB" opacity="0.92"/>
  <text x="316" y="159" fill="#93c5fd" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="14" font-weight="700" letter-spacing="1.4">MAGIC</text>
  <text x="316" y="173" fill="#475569" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="10" font-weight="400">libmagic &middot; binary signatures</text>

  <!-- Magika label -->
  <circle cx="495" cy="155" r="4.5" fill="#16A34A" opacity="0.92"/>
  <text x="506" y="159" fill="#86efac" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="14" font-weight="700" letter-spacing="1.4">MAGIKA</text>
  <text x="506" y="173" fill="#475569" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="10" font-weight="400">Google AI &middot; ML-based text detection</text>

  <!-- Dashed drop-lines to circles -->
  <line x1="305" y1="184" x2="305" y2="195" stroke="rgba(37, 99, 235, 0.28)" stroke-width="0.5" stroke-dasharray="3,5"/>
  <line x1="495" y1="184" x2="495" y2="195" stroke="rgba(22, 163, 74, 0.28)" stroke-width="0.5" stroke-dasharray="3,5"/>

  <!-- NEITHER &mdash; formats missed by both -->
  <g>
    <circle cx="745" cy="202" r="30" fill="rgba(30, 41, 59, 0.6)" stroke="rgba(148, 163, 184, 0.28)" stroke-width="1" stroke-dasharray="3,3"/>
    <text x="745" y="199" text-anchor="middle" fill="#9ca3af" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="20" font-weight="700">63</text>
    <text x="745" y="215" text-anchor="middle" fill="#64748b" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="9" font-weight="400">neither</text>
  </g>

  <!-- DIVIDER -->
  <line x1="60" y1="500" x2="840" y2="500" stroke="rgba(255,255,255,0.05)" stroke-width="1"/>

  <!-- UNION SUMMARY PANEL -->
  <rect x="55" y="530" width="790" height="80" rx="6" fill="rgba(15, 23, 42, 0.65)" stroke="rgba(37, 99, 235, 0.12)" stroke-width="1"/>
  <rect x="55" y="530" width="3" height="80" rx="1.5" fill="rgba(37, 99, 235, 0.55)"/>

  <text x="450" y="552" text-anchor="middle" fill="#94a3b8" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="11" font-weight="500" letter-spacing="2">UNION COVERAGE</text>
  <text x="450" y="567" text-anchor="middle" fill="#475569" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="9.5" font-weight="400">Correct in either standalone engine; not the runtime Hybrid route</text>

  <text x="450" y="595" text-anchor="middle" fill="#f8fafc" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="24" font-weight="800">535 / 598 = 89.5% covered</text>

  <g fill="#475569" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="8.5" font-weight="400">
    <text x="138" y="595" text-anchor="middle">161+197+177</text>
    <line x1="185" y1="590" x2="215" y2="590" stroke="rgba(71, 85, 105, 0.25)" stroke-width="0.5"/>
    <text x="770" y="595" text-anchor="middle">combined</text>
  </g>

  <!-- FOOTNOTE -->
  <text x="450" y="651" text-anchor="middle" fill="#334155" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="8.5" font-weight="400">Implemented Hybrid: 444 / 598 = 74.2% &middot; union is an upper bound, not runtime routing</text>
</svg>
